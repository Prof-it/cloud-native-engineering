# Exercise 5: why realms are managed with Terraform and not with this CR.
# KeycloakRealmImport creates a realm if it does not exist. It never updates or
# deletes one: change accessTokenLifespan below, apply again, and the realm in
# Keycloak keeps the old value (scripts/live-verify.sh checks this).
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: sandbox
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm:
    realm: sandbox
    enabled: true
    accessTokenLifespan: 300
